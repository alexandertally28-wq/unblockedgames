<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Asteroids Space Blaster</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #05070e;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 500px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 700;
      color: #94a3b8;
    }
    .val-cyan { color: #38bdf8; font-size: 16px; }
    .val-amber { color: #f59e0b; font-size: 16px; }
    #canvas-wrap {
      position: relative;
      width: 500px;
      height: 480px;
      max-width: 95vw;
      max-height: 75vh;
      background: #090d16;
      border: 2px solid #1e293b;
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.1);
      overflow: hidden;
    }
    canvas { width: 100%; height: 100%; display: block; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(9, 13, 22, 0.9);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-align: center;
      padding: 24px;
    }
    .overlay.hidden { display: none; }
    .btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 10px 22px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn:hover { background: #0369a1; }
    .instructions {
      font-size: 12px;
      color: #64748b;
      margin-top: 10px;
      display: flex;
      gap: 14px;
    }
    .mobile-controls {
      display: none;
      margin-top: 10px;
      gap: 8px;
    }
    @media (max-width: 600px) {
      .mobile-controls { display: flex; }
    }
    .m-btn {
      background: #1e293b;
      color: white;
      border: 1px solid #334155;
      padding: 10px 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div>SCORE: <span class="val-cyan" id="score">0</span></div>
    <div>LIVES: <span class="val-amber" id="lives">3</span></div>
    <div>WAVE: <span style="color:#a855f7;" id="wave">1</span></div>
  </div>

  <div id="canvas-wrap">
    <canvas id="gameCanvas" width="500" height="480"></canvas>
    <div id="startOverlay" class="overlay">
      <h2 style="font-size: 28px; color: #38bdf8;">SPACE ASTEROIDS</h2>
      <p style="font-size: 13px; color: #94a3b8; max-width: 320px;">Rotate ship, thrust forward, and blast incoming cosmic asteroids into dust.</p>
      <button class="btn" id="startBtn">LAUNCH SHIP</button>
    </div>
    <div id="gameOverOverlay" class="overlay hidden">
      <h2 style="font-size: 28px; color: #f43f5e;">CRITICAL FAILURE</h2>
      <p style="font-size: 14px; color: #cbd5e1;">Final Score: <span id="finalScore" style="color:#38bdf8; font-weight:bold;">0</span></p>
      <button class="btn" id="restartBtn">RETRY MISSION</button>
    </div>
  </div>

  <div class="instructions">
    <span>[← / → / A / D] Rotate</span>
    <span>[↑ / W] Thrust</span>
    <span>[Space] Fire Laser</span>
  </div>

  <div class="mobile-controls">
    <button class="m-btn" id="m-left">↺ Left</button>
    <button class="m-btn" id="m-thrust">▲ Thrust</button>
    <button class="m-btn" id="m-right">↻ Right</button>
    <button class="m-btn" style="background: #0284c7;" id="m-fire">⚡ FIRE</button>
  </div>

  <script>
    let audioCtx = null;
    function playSound(type) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const t = audioCtx.currentTime;

        if (type === 'laser') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(880, t);
          osc.frequency.exponentialRampToValueAtTime(110, t + 0.12);
          gain.gain.setValueAtTime(0.08, t);
          gain.gain.linearRampToValueAtTime(0, t + 0.12);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + 0.12);
        } else if (type === 'hit') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(140, t);
          osc.frequency.exponentialRampToValueAtTime(40, t + 0.2);
          gain.gain.setValueAtTime(0.12, t);
          gain.gain.linearRampToValueAtTime(0, t + 0.2);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + 0.2);
        } else if (type === 'thrust') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(60, t);
          gain.gain.setValueAtTime(0.04, t);
          gain.gain.linearRampToValueAtTime(0, t + 0.08);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + 0.08);
        }
      } catch (e) {}
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const waveEl = document.getElementById('wave');
    const finalScoreEl = document.getElementById('finalScore');
    const startOverlay = document.getElementById('startOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');

    let score = 0;
    let lives = 3;
    let wave = 1;
    let isRunning = false;
    let animationId = null;

    const ship = {
      x: 250,
      y: 240,
      r: 12,
      angle: -Math.PI / 2,
      rotSpeed: 0.07,
      isThrusting: false,
      thrust: { x: 0, y: 0 },
      invulnerable: 0
    };

    let keys = {};
    let bullets = [];
    let asteroids = [];
    let particles = [];
    let stars = [];

    // Background stars
    for (let i = 0; i < 40; i++) {
      stars.push({
        x: Math.random() * 500,
        y: Math.random() * 480,
        size: Math.random() * 1.5 + 0.5,
        alpha: Math.random() * 0.7 + 0.3
      });
    }

    function createAsteroid(x, y, radius, level = 3) {
      const vertCount = Math.floor(Math.random() * 4) + 8;
      const offsets = [];
      for (let i = 0; i < vertCount; i++) {
        offsets.push((Math.random() * 0.4 + 0.8) * radius);
      }
      return {
        x: x !== undefined ? x : Math.random() * canvas.width,
        y: y !== undefined ? y : Math.random() * canvas.height,
        r: radius,
        level: level,
        dx: (Math.random() - 0.5) * (4 - level) * 1.3,
        dy: (Math.random() - 0.5) * (4 - level) * 1.3,
        angle: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 0.04,
        offsets: offsets
      };
    }

    function spawnWave() {
      asteroids = [];
      const count = 3 + wave;
      for (let i = 0; i < count; i++) {
        let x, y, dist;
        do {
          x = Math.random() * canvas.width;
          y = Math.random() * canvas.height;
          dist = Math.hypot(x - ship.x, y - ship.y);
        } while (dist < 120);
        asteroids.push(createAsteroid(x, y, 35, 3));
      }
    }

    function resetGame() {
      score = 0;
      lives = 3;
      wave = 1;
      bullets = [];
      particles = [];
      ship.x = canvas.width / 2;
      ship.y = canvas.height / 2;
      ship.thrust = { x: 0, y: 0 };
      ship.angle = -Math.PI / 2;
      ship.invulnerable = 120;
      scoreEl.textContent = '0';
      livesEl.textContent = '3';
      waveEl.textContent = '1';
      startOverlay.classList.add('hidden');
      gameOverOverlay.classList.add('hidden');
      isRunning = true;
      spawnWave();
      if (animationId) cancelAnimationFrame(animationId);
      loop();
    }

    function fireLaser() {
      if (!isRunning) return;
      if (bullets.length >= 6) return;
      bullets.push({
        x: ship.x + Math.cos(ship.angle) * ship.r * 1.4,
        y: ship.y + Math.sin(ship.angle) * ship.r * 1.4,
        dx: Math.cos(ship.angle) * 8,
        dy: Math.sin(ship.angle) * 8,
        life: 50
      });
      playSound('laser');
    }

    function addExplosion(x, y, count = 12, color = '#f59e0b') {
      for (let i = 0; i < count; i++) {
        const speed = Math.random() * 3 + 1;
        const angle = Math.random() * Math.PI * 2;
        particles.push({
          x: x,
          y: y,
          dx: Math.cos(angle) * speed,
          dy: Math.sin(angle) * speed,
          life: 25 + Math.random() * 15,
          color: color
        });
      }
    }

    function loop() {
      if (!isRunning) return;

      // Ship controls
      if (keys['arrowleft'] || keys['a']) ship.angle -= ship.rotSpeed;
      if (keys['arrowright'] || keys['d']) ship.angle += ship.rotSpeed;

      if (keys['arrowup'] || keys['w'] || ship.isThrusting) {
        ship.thrust.x += Math.cos(ship.angle) * 0.12;
        ship.thrust.y += Math.sin(ship.angle) * 0.12;
        // Exhaust particle
        if (Math.random() < 0.6) {
          particles.push({
            x: ship.x - Math.cos(ship.angle) * ship.r,
            y: ship.y - Math.sin(ship.angle) * ship.r,
            dx: -Math.cos(ship.angle) * 2 + (Math.random() - 0.5),
            dy: -Math.sin(ship.angle) * 2 + (Math.random() - 0.5),
            life: 14,
            color: '#38bdf8'
          });
        }
      }

      // Physics friction
      ship.thrust.x *= 0.985;
      ship.thrust.y *= 0.985;
      ship.x += ship.thrust.x;
      ship.y += ship.thrust.y;

      // Wrap ship
      if (ship.x < 0) ship.x = canvas.width;
      if (ship.x > canvas.width) ship.x = 0;
      if (ship.y < 0) ship.y = canvas.height;
      if (ship.y > canvas.height) ship.y = 0;

      if (ship.invulnerable > 0) ship.invulnerable--;

      // Bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.dx;
        b.y += b.dy;
        b.life--;

        // Wrap bullets
        if (b.x < 0) b.x = canvas.width;
        if (b.x > canvas.width) b.x = 0;
        if (b.y < 0) b.y = canvas.height;
        if (b.y > canvas.height) b.y = 0;

        if (b.life <= 0) {
          bullets.splice(i, 1);
          continue;
        }

        // Bullet vs Asteroid collision
        for (let j = asteroids.length - 1; j >= 0; j--) {
          const a = asteroids[j];
          if (Math.hypot(b.x - a.x, b.y - a.y) < a.r) {
            playSound('hit');
            addExplosion(a.x, a.y, a.r > 25 ? 16 : 8, '#38bdf8');
            score += a.level === 3 ? 20 : a.level === 2 ? 50 : 100;
            scoreEl.textContent = score;

            if (a.level > 1) {
              asteroids.push(createAsteroid(a.x, a.y, a.r * 0.6, a.level - 1));
              asteroids.push(createAsteroid(a.x, a.y, a.r * 0.6, a.level - 1));
            }
            asteroids.splice(j, 1);
            bullets.splice(i, 1);
            break;
          }
        }
      }

      // Check wave clear
      if (asteroids.length === 0) {
        wave++;
        waveEl.textContent = wave;
        spawnWave();
      }

      // Asteroids movement & ship collision
      for (let i = 0; i < asteroids.length; i++) {
        const a = asteroids[i];
        a.x += a.dx;
        a.y += a.dy;
        a.angle += a.rotSpeed;

        if (a.x < -a.r) a.x = canvas.width + a.r;
        if (a.x > canvas.width + a.r) a.x = -a.r;
        if (a.y < -a.r) a.y = canvas.height + a.r;
        if (a.y > canvas.height + a.r) a.y = -a.r;

        // Ship collision
        if (ship.invulnerable === 0 && Math.hypot(ship.x - a.x, ship.y - a.y) < a.r + ship.r) {
          playSound('hit');
          addExplosion(ship.x, ship.y, 25, '#f43f5e');
          lives--;
          livesEl.textContent = lives;
          ship.x = canvas.width / 2;
          ship.y = canvas.height / 2;
          ship.thrust = { x: 0, y: 0 };
          ship.invulnerable = 120;

          if (lives <= 0) {
            isRunning = false;
            finalScoreEl.textContent = score;
            gameOverOverlay.classList.remove('hidden');
            return;
          }
        }
      }

      // Update particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.dx;
        p.y += p.dy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }

      draw();
      animationId = requestAnimationFrame(loop);
    }

    function draw() {
      ctx.fillStyle = '#090d16';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Stars
      ctx.fillStyle = '#ffffff';
      stars.forEach(s => {
        ctx.globalAlpha = s.alpha;
        ctx.fillRect(s.x, s.y, s.size, s.size);
      });
      ctx.globalAlpha = 1;

      // Bullets
      ctx.fillStyle = '#38bdf8';
      ctx.shadowBlur = 8;
      ctx.shadowColor = '#38bdf8';
      bullets.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, 2.5, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.shadowBlur = 0;

      // Particles
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life / 30;
        ctx.fillRect(p.x, p.y, 2, 2);
      });
      ctx.globalAlpha = 1;

      // Asteroids
      asteroids.forEach(a => {
        ctx.save();
        ctx.translate(a.x, a.y);
        ctx.rotate(a.angle);
        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = 1.8;
        ctx.fillStyle = '#1e293b';
        ctx.beginPath();
        const total = a.offsets.length;
        for (let i = 0; i < total; i++) {
          const ang = (i / total) * Math.PI * 2;
          const r = a.offsets[i];
          const px = Math.cos(ang) * r;
          const py = Math.sin(ang) * r;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      });

      // Ship
      if (ship.invulnerable % 10 < 5) {
        ctx.save();
        ctx.translate(ship.x, ship.y);
        ctx.rotate(ship.angle);
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2;
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.moveTo(ship.r * 1.4, 0);
        ctx.lineTo(-ship.r, -ship.r * 0.8);
        ctx.lineTo(-ship.r * 0.5, 0);
        ctx.lineTo(-ship.r, ship.r * 0.8);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Thrust flame
        if (keys['arrowup'] || keys['w'] || ship.isThrusting) {
          ctx.strokeStyle = '#f97316';
          ctx.beginPath();
          ctx.moveTo(-ship.r * 0.5, -4);
          ctx.lineTo(-ship.r * 1.5, 0);
          ctx.lineTo(-ship.r * 0.5, 4);
          ctx.stroke();
        }
        ctx.restore();
      }
    }

    window.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      keys[k] = true;
      if (e.key === ' ' && isRunning) {
        e.preventDefault();
        fireLaser();
      }
    });

    window.addEventListener('keyup', (e) => {
      keys[e.key.toLowerCase()] = false;
    });

    startBtn.addEventListener('click', resetGame);
    restartBtn.addEventListener('click', resetGame);

    // Mobile controls
    const mLeft = document.getElementById('m-left');
    const mRight = document.getElementById('m-right');
    const mThrust = document.getElementById('m-thrust');
    const mFire = document.getElementById('m-fire');

    mLeft.addEventListener('touchstart', (e) => { e.preventDefault(); keys['arrowleft'] = true; });
    mLeft.addEventListener('touchend', () => { keys['arrowleft'] = false; });
    mRight.addEventListener('touchstart', (e) => { e.preventDefault(); keys['arrowright'] = true; });
    mRight.addEventListener('touchend', () => { keys['arrowright'] = false; });
    mThrust.addEventListener('touchstart', (e) => { e.preventDefault(); ship.isThrusting = true; });
    mThrust.addEventListener('touchend', () => { ship.isThrusting = false; });
    mFire.addEventListener('touchstart', (e) => { e.preventDefault(); fireLaser(); });
  </script>
</body>
</html>
