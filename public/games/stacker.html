<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Tower Stack Master</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: manipulation;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 380px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 700;
      color: #94a3b8;
    }
    .val-cyan { color: #38bdf8; font-size: 20px; }
    .val-amber { color: #f59e0b; font-size: 20px; }
    #canvas-wrap {
      position: relative;
      width: 380px;
      height: 480px;
      max-width: 95vw;
      max-height: 75vh;
      background: #0f172a;
      border: 2px solid #1e293b;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.12);
      overflow: hidden;
    }
    canvas { width: 100%; height: 100%; display: block; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-align: center;
      padding: 24px;
    }
    .overlay.hidden { display: none; }
    .btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 10px 22px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn:hover { background: #0369a1; }
    .hint {
      margin-top: 10px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div>STACK: <span class="val-cyan" id="score">0</span></div>
    <div>BEST: <span class="val-amber" id="highScore">0</span></div>
  </div>

  <div id="canvas-wrap">
    <canvas id="gameCanvas" width="380" height="480"></canvas>
    <div id="startOverlay" class="overlay">
      <h2 style="font-size: 26px; color: #38bdf8;">TOWER STACK</h2>
      <p style="font-size: 13px; color: #94a3b8;">Time your drop precisely to slice and stack blocks as high as the sky.</p>
      <button class="btn" id="startBtn">START STACKING</button>
    </div>
    <div id="gameOverOverlay" class="overlay hidden">
      <h2 style="font-size: 26px; color: #f43f5e;">TOWER TOPPLED</h2>
      <p style="font-size: 14px; color: #cbd5e1;">Final Height: <span id="finalScore" style="color:#38bdf8; font-weight:bold;">0</span></p>
      <button class="btn" id="restartBtn">STACK AGAIN</button>
    </div>
  </div>

  <div class="hint">[Spacebar / Click / Tap] Drop current sliding block</div>

  <script>
    let audioCtx = null;
    function playChime(pitch = 1) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const freq = 260 + pitch * 32;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.14);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.14);
      } catch (e) {}
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const finalScoreEl = document.getElementById('finalScore');
    const startOverlay = document.getElementById('startOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');

    const BLOCK_HEIGHT = 20;
    let stack = [];
    let currentBlock = null;
    let direction = 1;
    let speed = 3.5;
    let isRunning = false;
    let score = 0;
    let highScore = parseInt(localStorage.getItem('stack_highscore') || '0', 10);
    highScoreEl.textContent = highScore;
    let animId = null;

    function getColor(index) {
      const hue = (index * 14 + 180) % 360;
      return `hsl(${hue}, 80%, 55%)`;
    }

    function resetGame() {
      score = 0;
      scoreEl.textContent = '0';
      speed = 3.5;
      direction = 1;
      stack = [
        { x: 90, y: canvas.height - BLOCK_HEIGHT, w: 200, color: getColor(0) }
      ];
      spawnNext();
      startOverlay.classList.add('hidden');
      gameOverOverlay.classList.add('hidden');
      isRunning = true;
      if (animId) cancelAnimationFrame(animId);
      loop();
    }

    function spawnNext() {
      const top = stack[stack.length - 1];
      currentBlock = {
        x: 0,
        y: top.y - BLOCK_HEIGHT,
        w: top.w,
        color: getColor(stack.length)
      };
      direction = 1;
    }

    function placeBlock() {
      if (!isRunning || !currentBlock) return;

      const top = stack[stack.length - 1];
      const diff = currentBlock.x - top.x;

      // Perfect drop tolerance
      if (Math.abs(diff) <= 3) {
        currentBlock.x = top.x;
        playChime(stack.length + 4);
      } else {
        playChime(stack.length);
      }

      const overhang = currentBlock.x - top.x;

      if (Math.abs(overhang) >= top.w) {
        // Complete miss!
        isRunning = false;
        finalScoreEl.textContent = score;
        gameOverOverlay.classList.remove('hidden');
        return;
      }

      // Slice block
      if (overhang > 0) {
        currentBlock.w -= overhang;
      } else if (overhang < 0) {
        currentBlock.w += overhang;
        currentBlock.x = top.x;
      }

      stack.push({ ...currentBlock });
      score++;
      scoreEl.textContent = score;

      if (score > highScore) {
        highScore = score;
        highScoreEl.textContent = highScore;
        localStorage.setItem('stack_highscore', highScore.toString());
      }

      // Increase speed slightly
      speed = Math.min(7.5, 3.5 + score * 0.1);

      // Camera shift if high
      if (stack[stack.length - 1].y < 180) {
        stack.forEach(b => b.y += BLOCK_HEIGHT);
      }

      spawnNext();
    }

    function loop() {
      if (!isRunning) return;

      currentBlock.x += speed * direction;
      if (currentBlock.x + currentBlock.w > canvas.width) {
        currentBlock.x = canvas.width - currentBlock.w;
        direction = -1;
      } else if (currentBlock.x < 0) {
        currentBlock.x = 0;
        direction = 1;
      }

      draw();
      animId = requestAnimationFrame(loop);
    }

    function draw() {
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Stacked blocks
      stack.forEach((b) => {
        ctx.fillStyle = b.color;
        ctx.fillRect(b.x, b.y, b.w, BLOCK_HEIGHT);
        ctx.strokeStyle = '#090d16';
        ctx.lineWidth = 1;
        ctx.strokeRect(b.x, b.y, b.w, BLOCK_HEIGHT);
      });

      // Current sliding block
      if (currentBlock) {
        ctx.fillStyle = currentBlock.color;
        ctx.shadowBlur = 8;
        ctx.shadowColor = currentBlock.color;
        ctx.fillRect(currentBlock.x, currentBlock.y, currentBlock.w, BLOCK_HEIGHT);
        ctx.shadowBlur = 0;
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        if (!isRunning) resetGame();
        else placeBlock();
      }
    });

    canvas.addEventListener('click', () => {
      if (!isRunning) resetGame();
      else placeBlock();
    });

    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (!isRunning) resetGame();
      else placeBlock();
    }, { passive: false });

    startBtn.addEventListener('click', resetGame);
    restartBtn.addEventListener('click', resetGame);

    draw();
  </script>
</body>
</html>
