<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Doodle Sky Jumper</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 360px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 700;
      color: #94a3b8;
    }
    .val-cyan { color: #38bdf8; font-size: 18px; }
    .val-amber { color: #f59e0b; font-size: 18px; }
    #canvas-wrap {
      position: relative;
      width: 360px;
      height: 480px;
      max-width: 95vw;
      max-height: 75vh;
      background: #0f172a;
      border: 2px solid #1e293b;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.12);
      overflow: hidden;
    }
    canvas { width: 100%; height: 100%; display: block; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-align: center;
      padding: 24px;
    }
    .overlay.hidden { display: none; }
    .btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 10px 22px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn:hover { background: #0369a1; }
    .hint {
      margin-top: 10px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div>ALTITUDE: <span class="val-cyan" id="score">0</span></div>
    <div>BEST: <span class="val-amber" id="highScore">0</span></div>
  </div>

  <div id="canvas-wrap">
    <canvas id="gameCanvas" width="360" height="480"></canvas>
    <div id="startOverlay" class="overlay">
      <h2 style="font-size: 26px; color: #38bdf8;">DOODLE JUMP</h2>
      <p style="font-size: 13px; color: #94a3b8;">Bounce higher and higher. Watch out for moving and fragile platforms!</p>
      <button class="btn" id="startBtn">START JUMPING</button>
    </div>
    <div id="gameOverOverlay" class="overlay hidden">
      <h2 style="font-size: 26px; color: #f43f5e;">FALLEN!</h2>
      <p style="font-size: 14px; color: #cbd5e1;">Altitude: <span id="finalScore" style="color:#38bdf8; font-weight:bold;">0</span></p>
      <button class="btn" id="restartBtn">JUMP AGAIN</button>
    </div>
  </div>

  <div class="hint">[← / → / A / D or Tilt / Touch] Steer horizontal direction</div>

  <script>
    let audioCtx = null;
    function playBounce() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(320, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(640, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
      } catch (e) {}
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const finalScoreEl = document.getElementById('finalScore');
    const startOverlay = document.getElementById('startOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');

    let score = 0;
    let highScore = parseInt(localStorage.getItem('doodle_highscore') || '0', 10);
    highScoreEl.textContent = highScore;
    let isRunning = false;
    let animId = null;

    const player = {
      x: 170,
      y: 350,
      w: 24,
      h: 24,
      vx: 0,
      vy: 0,
      gravity: 0.32,
      jump: -9.5
    };

    let platforms = [];
    let keys = {};

    function initPlatforms() {
      platforms = [];
      // Starting safe platform
      platforms.push({ x: 140, y: 420, w: 70, h: 12, type: 'normal' });
      for (let i = 1; i < 7; i++) {
        platforms.push({
          x: Math.random() * (canvas.width - 70),
          y: 420 - i * 65,
          w: 70,
          h: 12,
          type: Math.random() < 0.2 ? 'moving' : 'normal',
          vx: Math.random() > 0.5 ? 1.5 : -1.5
        });
      }
    }

    function resetGame() {
      score = 0;
      scoreEl.textContent = '0';
      player.x = 168;
      player.y = 380;
      player.vx = 0;
      player.vy = player.jump;
      initPlatforms();
      startOverlay.classList.add('hidden');
      gameOverOverlay.classList.add('hidden');
      isRunning = true;
      if (animId) cancelAnimationFrame(animId);
      loop();
    }

    function loop() {
      if (!isRunning) return;

      // Horizontal steer
      if (keys['arrowleft'] || keys['a']) player.vx = -4.5;
      else if (keys['arrowright'] || keys['d']) player.vx = 4.5;
      else player.vx *= 0.85;

      player.x += player.vx;
      player.vy += player.gravity;
      player.y += player.vy;

      // Screen wrap
      if (player.x < -player.w) player.x = canvas.width;
      if (player.x > canvas.width) player.x = -player.w;

      // Move moving platforms
      platforms.forEach(p => {
        if (p.type === 'moving') {
          p.x += p.vx;
          if (p.x <= 0 || p.x + p.w >= canvas.width) p.vx = -p.vx;
        }
      });

      // Platform bounce (only when falling)
      if (player.vy > 0) {
        platforms.forEach(p => {
          if (
            player.x + player.w > p.x &&
            player.x < p.x + p.w &&
            player.y + player.h >= p.y &&
            player.y + player.h <= p.y + 14
          ) {
            player.vy = player.jump;
            playBounce();
          }
        });
      }

      // Camera scroll upwards
      if (player.y < 200) {
        const diff = 200 - player.y;
        player.y = 200;
        score += Math.floor(diff);
        scoreEl.textContent = score;

        if (score > highScore) {
          highScore = score;
          highScoreEl.textContent = highScore;
          localStorage.setItem('doodle_highscore', highScore.toString());
        }

        platforms.forEach(p => {
          p.y += diff;
        });

        // Remove below-screen platforms & spawn new above
        platforms = platforms.filter(p => p.y < canvas.height + 20);
        while (platforms.length < 8) {
          const topY = Math.min(...platforms.map(p => p.y));
          platforms.push({
            x: Math.random() * (canvas.width - 70),
            y: topY - (Math.random() * 25 + 55),
            w: 65,
            h: 12,
            type: Math.random() < 0.25 ? 'moving' : 'normal',
            vx: Math.random() > 0.5 ? 1.8 : -1.8
          });
        }
      }

      // Fall off bottom death
      if (player.y > canvas.height + 30) {
        isRunning = false;
        finalScoreEl.textContent = score;
        gameOverOverlay.classList.remove('hidden');
        return;
      }

      draw();
      animId = requestAnimationFrame(loop);
    }

    function draw() {
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Platforms
      platforms.forEach(p => {
        ctx.fillStyle = p.type === 'moving' ? '#38bdf8' : '#10b981';
        ctx.shadowBlur = 6;
        ctx.shadowColor = p.type === 'moving' ? '#0284c7' : '#059669';
        ctx.beginPath();
        ctx.roundRect(p.x, p.y, p.w, p.h, 4);
        ctx.fill();
      });
      ctx.shadowBlur = 0;

      // Doodle character
      ctx.fillStyle = '#f59e0b';
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#d97706';
      ctx.beginPath();
      ctx.arc(player.x + player.w / 2, player.y + player.h / 2, player.w / 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Eyes
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(player.x + 8, player.y + 8, 3, 0, Math.PI * 2);
      ctx.arc(player.x + 16, player.y + 8, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000000';
      ctx.beginPath();
      ctx.arc(player.x + 8, player.y + 8, 1.5, 0, Math.PI * 2);
      ctx.arc(player.x + 16, player.y + 8, 1.5, 0, Math.PI * 2);
      ctx.fill();
    }

    window.addEventListener('keydown', (e) => {
      keys[e.key.toLowerCase()] = true;
    });

    window.addEventListener('keyup', (e) => {
      keys[e.key.toLowerCase()] = false;
    });

    // Touch steer
    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const touchX = (e.touches[0].clientX - rect.left) * (canvas.width / rect.width);
      if (touchX < player.x) player.vx = -4.5;
      else if (touchX > player.x + player.w) player.vx = 4.5;
    }, { passive: false });

    startBtn.addEventListener('click', resetGame);
    restartBtn.addEventListener('click', resetGame);

    initPlatforms();
    draw();
  </script>
</body>
</html>
