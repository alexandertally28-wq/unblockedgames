<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Tic Tac Toe Neon</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
      user-select: none;
    }
    .hud {
      display: flex;
      gap: 16px;
      margin-bottom: 12px;
    }
    .score-box {
      background: #0f172a;
      border: 1px solid #1e293b;
      padding: 6px 14px;
      border-radius: 8px;
      text-align: center;
      min-width: 80px;
    }
    .score-title { font-size: 10px; color: #94a3b8; font-weight: 700; text-transform: uppercase; }
    .score-val { font-size: 18px; font-weight: 800; }
    .mode-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }
    .m-btn {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    .m-btn.active {
      background: #0284c7;
      color: white;
      border-color: #38bdf8;
    }
    .status-text {
      font-size: 15px;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 12px;
      min-height: 22px;
    }
    #grid {
      display: grid;
      grid-template-columns: repeat(3, 90px);
      grid-template-rows: repeat(3, 90px);
      gap: 8px;
      background: #0f172a;
      padding: 10px;
      border-radius: 12px;
      border: 2px solid #1e293b;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.1);
    }
    .cell {
      background: #1e293b;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      font-weight: 900;
      cursor: pointer;
      transition: background 0.1s, transform 0.08s;
    }
    .cell:hover:empty { background: #334155; }
    .cell:active:empty { transform: scale(0.96); }
    .cell.x { color: #38bdf8; text-shadow: 0 0 14px rgba(56, 189, 248, 0.6); }
    .cell.o { color: #f43f5e; text-shadow: 0 0 14px rgba(244, 63, 94, 0.6); }
    .cell.win { background: #15334e; border: 2px solid #38bdf8; }
    .reset-btn {
      margin-top: 14px;
      background: #0284c7;
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .reset-btn:hover { background: #0369a1; }
  </style>
</head>
<body>
  <div class="mode-bar">
    <button class="m-btn active" id="btnVsAi">vs Computer</button>
    <button class="m-btn" id="btn2P">2 Players</button>
  </div>

  <div class="hud">
    <div class="score-box">
      <div class="score-title">X (Blue)</div>
      <div class="score-val" style="color: #38bdf8;" id="xScore">0</div>
    </div>
    <div class="score-box">
      <div class="score-title">Ties</div>
      <div class="score-val" style="color: #94a3b8;" id="tiesScore">0</div>
    </div>
    <div class="score-box">
      <div class="score-title">O (Pink)</div>
      <div class="score-val" style="color: #f43f5e;" id="oScore">0</div>
    </div>
  </div>

  <div class="status-text" id="statusText">X's Turn</div>

  <div id="grid"></div>

  <button class="reset-btn" id="resetBtn">Restart Round</button>

  <script>
    let audioCtx = null;
    function playBeep(freq) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
      } catch (e) {}
    }

    const gridEl = document.getElementById('grid');
    const statusText = document.getElementById('statusText');
    const xScoreEl = document.getElementById('xScore');
    const oScoreEl = document.getElementById('oScore');
    const tiesScoreEl = document.getElementById('tiesScore');
    const resetBtn = document.getElementById('resetBtn');
    const btnVsAi = document.getElementById('btnVsAi');
    const btn2P = document.getElementById('btn2P');

    let board = Array(9).fill('');
    let turn = 'X';
    let vsAi = true;
    let gameOver = false;
    let scores = { X: 0, O: 0, ties: 0 };

    btnVsAi.addEventListener('click', () => {
      vsAi = true;
      btnVsAi.classList.add('active');
      btn2P.classList.remove('active');
      resetRound();
    });

    btn2P.addEventListener('click', () => {
      vsAi = false;
      btn2P.classList.add('active');
      btnVsAi.classList.remove('active');
      resetRound();
    });

    const WIN_PATTERNS = [
      [0,1,2], [3,4,5], [6,7,8],
      [0,3,6], [1,4,7], [2,5,8],
      [0,4,8], [2,4,6]
    ];

    function checkWin(b) {
      for (const [x, y, z] of WIN_PATTERNS) {
        if (b[x] && b[x] === b[y] && b[x] === b[z]) {
          return { winner: b[x], combo: [x, y, z] };
        }
      }
      if (b.every(c => c !== '')) return { winner: 'tie', combo: [] };
      return null;
    }

    function render() {
      gridEl.innerHTML = '';
      board.forEach((val, i) => {
        const cell = document.createElement('div');
        cell.className = 'cell' + (val ? ` ${val.toLowerCase()}` : '');
        cell.textContent = val;
        cell.addEventListener('click', () => makeMove(i));
        gridEl.appendChild(cell);
      });
    }

    function makeMove(i) {
      if (gameOver || board[i] !== '') return;

      board[i] = turn;
      playBeep(turn === 'X' ? 440 : 560);
      const res = checkWin(board);

      if (res) {
        handleEnd(res);
      } else {
        turn = turn === 'X' ? 'O' : 'X';
        statusText.textContent = `${turn}'s Turn`;
        statusText.style.color = turn === 'X' ? '#38bdf8' : '#f43f5e';
        render();

        if (vsAi && turn === 'O') {
          setTimeout(aiMove, 300);
        }
      }
    }

    function aiMove() {
      if (gameOver) return;

      // Check win for O or block X
      let move = -1;
      for (let i = 0; i < 9; i++) {
        if (board[i] === '') {
          board[i] = 'O';
          if (checkWin(board)?.winner === 'O') { move = i; board[i] = ''; break; }
          board[i] = '';
        }
      }

      if (move === -1) {
        for (let i = 0; i < 9; i++) {
          if (board[i] === '') {
            board[i] = 'X';
            if (checkWin(board)?.winner === 'X') { move = i; board[i] = ''; break; }
            board[i] = '';
          }
        }
      }

      // Center
      if (move === -1 && board[4] === '') move = 4;

      // Random available
      if (move === -1) {
        const empties = board.map((v, i) => v === '' ? i : null).filter(v => v !== null);
        move = empties[Math.floor(Math.random() * empties.length)];
      }

      if (move !== -1) {
        board[move] = 'O';
        playBeep(560);
        const res = checkWin(board);
        if (res) {
          handleEnd(res);
        } else {
          turn = 'X';
          statusText.textContent = "X's Turn";
          statusText.style.color = '#38bdf8';
          render();
        }
      }
    }

    function handleEnd(res) {
      gameOver = true;
      render();
      if (res.winner === 'tie') {
        statusText.textContent = "It's a Tie Game!";
        statusText.style.color = '#94a3b8';
        scores.ties++;
        tiesScoreEl.textContent = scores.ties;
        playBeep(250);
      } else {
        statusText.textContent = `${res.winner} Wins!`;
        statusText.style.color = res.winner === 'X' ? '#38bdf8' : '#f43f5e';
        scores[res.winner]++;
        xScoreEl.textContent = scores.X;
        oScoreEl.textContent = scores.O;
        playBeep(800);
        res.combo.forEach(idx => {
          gridEl.children[idx].classList.add('win');
        });
      }
    }

    function resetRound() {
      board = Array(9).fill('');
      turn = 'X';
      gameOver = false;
      statusText.textContent = "X's Turn";
      statusText.style.color = '#38bdf8';
      render();
    }

    resetBtn.addEventListener('click', resetRound);

    resetRound();
  </script>
</body>
</html>
