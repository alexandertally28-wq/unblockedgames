<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Flappy Wing</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #060911;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 380px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 700;
      color: #94a3b8;
    }
    .score-val { color: #38bdf8; font-size: 18px; }
    .best-val { color: #f59e0b; font-size: 18px; }
    #canvas-wrap {
      position: relative;
      width: 360px;
      height: 480px;
      max-width: 95vw;
      max-height: 75vh;
      background: #0f172a;
      border: 2px solid #1e293b;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.12);
      overflow: hidden;
    }
    canvas { width: 100%; height: 100%; display: block; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-align: center;
      padding: 24px;
    }
    .overlay.hidden { display: none; }
    .btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 10px 22px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn:hover { background: #0369a1; }
    .instructions {
      font-size: 12px;
      color: #64748b;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div>SCORE: <span class="score-val" id="score">0</span></div>
    <div>BEST: <span class="best-val" id="bestScore">0</span></div>
  </div>

  <div id="canvas-wrap">
    <canvas id="gameCanvas" width="360" height="480"></canvas>
    <div id="startOverlay" class="overlay">
      <h2 style="font-size: 26px; color: #38bdf8;">FLAPPY RETRO</h2>
      <p style="font-size: 13px; color: #94a3b8;">Tap or press Spacebar to flap wings. Avoid green energy conduits.</p>
      <button class="btn" id="startBtn">FLAP WINGS</button>
    </div>
    <div id="gameOverOverlay" class="overlay hidden">
      <h2 style="font-size: 26px; color: #f43f5e;">CRASHED!</h2>
      <p style="font-size: 14px; color: #cbd5e1;">Score: <span id="finalScore" style="color:#38bdf8; font-weight:bold;">0</span></p>
      <button class="btn" id="restartBtn">TRY AGAIN</button>
    </div>
  </div>

  <div class="instructions">
    [Spacebar / Click / Tap] Flap to gain altitude
  </div>

  <script>
    let audioCtx = null;
    function flapSound() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(420, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(700, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
      } catch (e) {}
    }

    function pointSound() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.setValueAtTime(1100, audioCtx.currentTime + 0.06);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.16);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.16);
      } catch (e) {}
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestScoreEl = document.getElementById('bestScore');
    const finalScoreEl = document.getElementById('finalScore');
    const startOverlay = document.getElementById('startOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');

    let score = 0;
    let bestScore = parseInt(localStorage.getItem('flappy_highscore') || '0', 10);
    bestScoreEl.textContent = bestScore;
    let isRunning = false;
    let animId = null;

    const bird = {
      x: 70,
      y: 200,
      r: 12,
      velocity: 0,
      gravity: 0.38,
      jump: -6.5
    };

    let pipes = [];
    const PIPE_GAP = 120;
    const PIPE_WIDTH = 48;
    let frame = 0;

    function resetGame() {
      score = 0;
      scoreEl.textContent = '0';
      bird.y = 200;
      bird.velocity = 0;
      pipes = [];
      frame = 0;
      startOverlay.classList.add('hidden');
      gameOverOverlay.classList.add('hidden');
      isRunning = true;
      if (animId) cancelAnimationFrame(animId);
      loop();
    }

    function flap() {
      if (!isRunning) return;
      bird.velocity = bird.jump;
      flapSound();
    }

    function loop() {
      if (!isRunning) return;
      frame++;

      // Bird physics
      bird.velocity += bird.gravity;
      bird.y += bird.velocity;

      // Spawn pipes
      if (frame % 85 === 0) {
        const minTop = 40;
        const maxTop = canvas.height - PIPE_GAP - 60;
        const topH = Math.floor(Math.random() * (maxTop - minTop)) + minTop;
        pipes.push({
          x: canvas.width,
          top: topH,
          bottom: topH + PIPE_GAP,
          passed: false
        });
      }

      // Move pipes & collision
      for (let i = pipes.length - 1; i >= 0; i--) {
        const p = pipes[i];
        p.x -= 2.6;

        // Score pass
        if (!p.passed && p.x + PIPE_WIDTH < bird.x) {
          p.passed = true;
          score++;
          scoreEl.textContent = score;
          pointSound();
          if (score > bestScore) {
            bestScore = score;
            bestScoreEl.textContent = bestScore;
            localStorage.setItem('flappy_highscore', bestScore.toString());
          }
        }

        // Collision box
        if (bird.x + bird.r > p.x && bird.x - bird.r < p.x + PIPE_WIDTH) {
          if (bird.y - bird.r < p.top || bird.y + bird.r > p.bottom) {
            return gameOver();
          }
        }

        if (p.x + PIPE_WIDTH < -10) pipes.splice(i, 1);
      }

      // Ground or ceiling collision
      if (bird.y + bird.r >= canvas.height || bird.y - bird.r <= 0) {
        return gameOver();
      }

      draw();
      animId = requestAnimationFrame(loop);
    }

    function gameOver() {
      isRunning = false;
      finalScoreEl.textContent = score;
      gameOverOverlay.classList.remove('hidden');
    }

    function draw() {
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Pipes
      pipes.forEach(p => {
        ctx.fillStyle = '#10b981';
        ctx.shadowBlur = 8;
        ctx.shadowColor = '#059669';
        // Top pipe
        ctx.fillRect(p.x, 0, PIPE_WIDTH, p.top);
        ctx.fillRect(p.x - 3, p.top - 16, PIPE_WIDTH + 6, 16);
        // Bottom pipe
        ctx.fillRect(p.x, p.bottom, PIPE_WIDTH, canvas.height - p.bottom);
        ctx.fillRect(p.x - 3, p.bottom, PIPE_WIDTH + 6, 16);
      });
      ctx.shadowBlur = 0;

      // Bird
      ctx.save();
      ctx.translate(bird.x, bird.y);
      const angle = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (bird.velocity / 8) * 0.6));
      ctx.rotate(angle);
      ctx.fillStyle = '#38bdf8';
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#0284c7';
      ctx.beginPath();
      ctx.arc(0, 0, bird.r, 0, Math.PI * 2);
      ctx.fill();

      // Eye
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(5, -4, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#090d16';
      ctx.beginPath();
      ctx.arc(6, -4, 2, 0, Math.PI * 2);
      ctx.fill();

      // Beak
      ctx.fillStyle = '#f59e0b';
      ctx.beginPath();
      ctx.moveTo(8, -1);
      ctx.lineTo(16, 2);
      ctx.lineTo(8, 5);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === ' ' || e.key === 'ArrowUp') {
        e.preventDefault();
        if (!isRunning) resetGame();
        else flap();
      }
    });

    canvas.addEventListener('click', () => {
      if (!isRunning) resetGame();
      else flap();
    });

    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (!isRunning) resetGame();
      else flap();
    }, { passive: false });

    startBtn.addEventListener('click', resetGame);
    restartBtn.addEventListener('click', resetGame);

    draw();
  </script>
</body>
</html>
