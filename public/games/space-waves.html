<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Space Waves</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #04060c;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
      user-select: none;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 600px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 700;
      color: #94a3b8;
    }
    .hud-progress {
      flex: 1;
      max-width: 220px;
      height: 8px;
      background: #1e293b;
      border-radius: 4px;
      overflow: hidden;
      margin: 0 12px;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #06b6d4, #38bdf8);
      transition: width 0.05s linear;
    }
    #canvas-wrap {
      position: relative;
      width: 600px;
      height: 380px;
      max-width: 96vw;
      max-height: 75vh;
      background: #080c18;
      border: 2px solid #1e293b;
      border-radius: 12px;
      box-shadow: 0 0 35px rgba(6, 182, 212, 0.15);
      overflow: hidden;
    }
    canvas { width: 100%; height: 100%; display: block; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(4, 6, 12, 0.92);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      text-align: center;
      padding: 24px;
    }
    .overlay.hidden { display: none; }
    .btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 10px 24px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(2, 132, 199, 0.4);
      transition: background 0.15s, transform 0.1s;
    }
    .btn:hover { background: #0369a1; }
    .btn:active { transform: scale(0.97); }
    .levels {
      display: flex;
      gap: 8px;
    }
    .lvl-btn {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .lvl-btn.active {
      background: #0891b2;
      color: white;
      border-color: #06b6d4;
    }
    .hint {
      margin-top: 10px;
      font-size: 12px;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div>ATTEMPT <span id="attemptEl" style="color:#38bdf8;">1</span></div>
    <div class="hud-progress">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div><span id="percentEl" style="color:#06b6d4;">0%</span></div>
  </div>

  <div id="canvas-wrap">
    <canvas id="gameCanvas" width="600" height="380"></canvas>
    <div id="startOverlay" class="overlay">
      <h2 style="font-size: 28px; font-weight: 900; color: #38bdf8; letter-spacing: -0.5px;">SPACE WAVES</h2>
      <p style="font-size: 13px; color: #94a3b8; max-width: 340px;">
        Hold click or spacebar to ascend at 45°. Release to dive at 45°. Never touch the neon barriers!
      </p>
      <div class="levels">
        <button class="lvl-btn active" id="btnLvl1">Level 1: Neon Dawn</button>
        <button class="lvl-btn" id="btnLvl2">Level 2: Cyber Void</button>
      </div>
      <button class="btn" id="startBtn">LAUNCH WAVE</button>
    </div>
    <div id="gameOverOverlay" class="overlay hidden">
      <h2 style="font-size: 28px; font-weight: 900; color: #f43f5e;">CRASHED!</h2>
      <p style="font-size: 14px; color: #cbd5e1;">Distance Reached: <span id="finalPercent" style="color:#38bdf8; font-weight:bold;">0%</span></p>
      <button class="btn" id="restartBtn">RETRY WAVE</button>
    </div>
    <div id="winOverlay" class="overlay hidden">
      <h2 style="font-size: 28px; font-weight: 900; color: #10b981;">LEVEL COMPLETE! 100%</h2>
      <p style="font-size: 14px; color: #cbd5e1;">Flawless cosmic wave navigation.</p>
      <button class="btn" id="nextLevelBtn">PLAY AGAIN</button>
    </div>
  </div>

  <div class="hint">
    [Hold Spacebar / Click / Touch] Ascend · [Release] Dive
  </div>

  <script>
    let audioCtx = null;
    function playBeep(freq, type = 'sine', duration = 0.08) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const attemptEl = document.getElementById('attemptEl');
    const progressBar = document.getElementById('progressBar');
    const percentEl = document.getElementById('percentEl');
    const finalPercent = document.getElementById('finalPercent');
    const startOverlay = document.getElementById('startOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const winOverlay = document.getElementById('winOverlay');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');
    const nextLevelBtn = document.getElementById('nextLevelBtn');
    const btnLvl1 = document.getElementById('btnLvl1');
    const btnLvl2 = document.getElementById('btnLvl2');

    let isRunning = false;
    let isHolding = false;
    let attempts = 1;
    let levelLength = 3200;
    let cameraX = 0;
    let animId = null;
    let currentLevel = 1;

    const ship = {
      x: 100,
      y: 190,
      r: 8,
      speedX: 5.5,
      speedY: 5.5
    };

    let trail = [];
    let obstacles = [];
    let particles = [];

    btnLvl1.addEventListener('click', () => {
      currentLevel = 1;
      ship.speedX = 5.5;
      ship.speedY = 5.5;
      btnLvl1.classList.add('active');
      btnLvl2.classList.remove('active');
    });

    btnLvl2.addEventListener('click', () => {
      currentLevel = 2;
      ship.speedX = 6.8;
      ship.speedY = 6.8;
      btnLvl2.classList.add('active');
      btnLvl1.classList.remove('active');
    });

    function generateObstacles() {
      obstacles = [];
      const h = canvas.height;
      const step = 200;
      
      for (let x = 400; x < levelLength; x += step) {
        const gap = currentLevel === 1 ? 130 : 105;
        const topH = Math.floor(Math.random() * (h - gap - 60)) + 30;
        
        // Top spike/pillar
        obstacles.push({
          type: 'pillar',
          x: x,
          y: 0,
          w: 36,
          h: topH,
          color: '#06b6d4'
        });

        // Bottom spike/pillar
        obstacles.push({
          type: 'pillar',
          x: x,
          y: topH + gap,
          w: 36,
          h: h - (topH + gap),
          color: '#06b6d4'
        });

        // Occasional floating diamond hazard in level 2
        if (currentLevel === 2 && Math.random() < 0.4) {
          obstacles.push({
            type: 'diamond',
            x: x + 100,
            y: topH + gap / 2,
            r: 14,
            color: '#f43f5e'
          });
        }
      }
    }

    function resetGame() {
      cameraX = 0;
      ship.x = 100;
      ship.y = canvas.height / 2;
      trail = [{ x: ship.x, y: ship.y }];
      particles = [];
      generateObstacles();
      startOverlay.classList.add('hidden');
      gameOverOverlay.classList.add('hidden');
      winOverlay.classList.add('hidden');
      isRunning = true;
      if (animId) cancelAnimationFrame(animId);
      loop();
    }

    function checkCollision() {
      // Ceiling or floor death
      if (ship.y - ship.r <= 6 || ship.y + ship.r >= canvas.height - 6) {
        return true;
      }

      // Check obstacles
      for (const obs of obstacles) {
        if (obs.type === 'pillar') {
          if (
            ship.x + ship.r > obs.x &&
            ship.x - ship.r < obs.x + obs.w &&
            ship.y + ship.r > obs.y &&
            ship.y - ship.r < obs.y + obs.h
          ) {
            return true;
          }
        } else if (obs.type === 'diamond') {
          if (Math.hypot(ship.x - obs.x, ship.y - obs.y) < ship.r + obs.r) {
            return true;
          }
        }
      }
      return false;
    }

    function loop() {
      if (!isRunning) return;

      // Move wave
      ship.x += ship.speedX;
      if (isHolding) {
        ship.y -= ship.speedY;
      } else {
        ship.y += ship.speedY;
      }

      cameraX = ship.x - 100;

      // Add to trail
      trail.push({ x: ship.x, y: ship.y });
      if (trail.length > 80) trail.shift();

      // Progress percentage
      const progress = Math.min(100, Math.floor((ship.x / levelLength) * 100));
      progressBar.style.width = `${progress}%`;
      percentEl.textContent = `${progress}%`;

      // Check win
      if (ship.x >= levelLength) {
        isRunning = false;
        playBeep(880, 'triangle', 0.3);
        winOverlay.classList.remove('hidden');
        return;
      }

      // Collision
      if (checkCollision()) {
        isRunning = false;
        playBeep(140, 'sawtooth', 0.25);
        attempts++;
        attemptEl.textContent = attempts;
        finalPercent.textContent = `${progress}%`;
        gameOverOverlay.classList.remove('hidden');
        return;
      }

      draw();
      animId = requestAnimationFrame(loop);
    }

    function draw() {
      ctx.fillStyle = '#060a14';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.translate(-cameraX, 0);

      // Neon Top & Bottom bounds
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(cameraX, 0, canvas.width, 6);
      ctx.fillRect(cameraX, canvas.height - 6, canvas.width, 6);
      ctx.strokeStyle = '#06b6d4';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cameraX, 6);
      ctx.lineTo(cameraX + canvas.width, 6);
      ctx.moveTo(cameraX, canvas.height - 6);
      ctx.lineTo(cameraX + canvas.width, canvas.height - 6);
      ctx.stroke();

      // Draw obstacles
      for (const obs of obstacles) {
        if (obs.x + obs.w < cameraX - 50 || obs.x > cameraX + canvas.width + 50) continue;

        if (obs.type === 'pillar') {
          ctx.fillStyle = '#0f172a';
          ctx.strokeStyle = obs.color;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.roundRect(obs.x, obs.y, obs.w, obs.h, 4);
          ctx.fill();
          ctx.stroke();

          // Neon inner glow strip
          ctx.fillStyle = obs.color;
          ctx.fillRect(obs.x + obs.w / 2 - 1, obs.y, 2, obs.h);
        } else if (obs.type === 'diamond') {
          ctx.save();
          ctx.translate(obs.x, obs.y);
          ctx.rotate(Math.PI / 4);
          ctx.fillStyle = '#3f1122';
          ctx.strokeStyle = obs.color;
          ctx.lineWidth = 2;
          ctx.fillRect(-obs.r, -obs.r, obs.r * 2, obs.r * 2);
          ctx.strokeRect(-obs.r, -obs.r, obs.r * 2, obs.r * 2);
          ctx.restore();
        }
      }

      // Draw wave trail
      if (trail.length > 1) {
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 4;
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#06b6d4';
        ctx.beginPath();
        ctx.moveTo(trail[0].x, trail[0].y);
        for (let i = 1; i < trail.length; i++) {
          ctx.lineTo(trail[i].x, trail[i].y);
        }
        ctx.stroke();
        ctx.shadowBlur = 0;
      }

      // Draw Ship Arrow
      ctx.save();
      ctx.translate(ship.x, ship.y);
      const angle = isHolding ? -Math.PI / 4 : Math.PI / 4;
      ctx.rotate(angle);
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#06b6d4';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(ship.r * 1.5, 0);
      ctx.lineTo(-ship.r, -ship.r);
      ctx.lineTo(-ship.r * 0.4, 0);
      ctx.lineTo(-ship.r, ship.r);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      ctx.restore();
    }

    // Input handlers
    const startHold = () => { isHolding = true; };
    const stopHold = () => { isHolding = false; };

    window.addEventListener('keydown', (e) => {
      if (e.key === ' ' || e.key === 'ArrowUp' || e.key.toLowerCase() === 'w') {
        e.preventDefault();
        if (!isRunning) {
          resetGame();
        } else {
          startHold();
        }
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === ' ' || e.key === 'ArrowUp' || e.key.toLowerCase() === 'w') {
        stopHold();
      }
    });

    canvas.addEventListener('mousedown', (e) => {
      if (!isRunning) resetGame();
      else startHold();
    });
    window.addEventListener('mouseup', stopHold);

    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (!isRunning) resetGame();
      else startHold();
    }, { passive: false });
    window.addEventListener('touchend', stopHold);

    startBtn.addEventListener('click', resetGame);
    restartBtn.addEventListener('click', resetGame);
    nextLevelBtn.addEventListener('click', resetGame);

    draw();
  </script>
</body>
</html>
