<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Neon Snake</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    .header {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 440px;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 600;
      color: #94a3b8;
    }
    .score-val { color: #38bdf8; font-size: 18px; font-weight: 700; }
    .high-val { color: #a855f7; font-size: 18px; font-weight: 700; }
    #canvas-wrap {
      position: relative;
      width: 420px;
      height: 420px;
      max-width: 94vw;
      max-height: 94vw;
      background: #0f172a;
      border: 2px solid #1e293b;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.15);
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 24px;
      text-align: center;
    }
    .overlay.hidden { display: none; }
    .btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 10px 24px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .btn:hover { background: #0369a1; }
    .btn:active { transform: scale(0.97); }
    .controls-hint {
      margin-top: 14px;
      font-size: 12px;
      color: #64748b;
      display: flex;
      gap: 16px;
    }
    .touch-pad {
      display: none;
      margin-top: 16px;
      grid-template-columns: repeat(3, 52px);
      grid-template-rows: repeat(2, 48px);
      gap: 6px;
    }
    @media (max-width: 600px) {
      .touch-pad { display: grid; }
    }
    .t-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: white;
      border-radius: 8px;
      font-weight: bold;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="header">
    <div>SCORE: <span class="score-val" id="score">0</span></div>
    <div>BEST: <span class="high-val" id="highScore">0</span></div>
  </div>

  <div id="canvas-wrap">
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div id="startOverlay" class="overlay">
      <h2 style="font-size: 26px; color: #38bdf8;">NEON SNAKE</h2>
      <p style="font-size: 13px; color: #94a3b8;">Use Arrow Keys or WASD to slither. Collect neon energy orbs.</p>
      <button class="btn" id="startBtn">START GAME</button>
    </div>
    <div id="gameOverOverlay" class="overlay hidden">
      <h2 style="font-size: 26px; color: #f43f5e;">GAME OVER</h2>
      <p style="font-size: 14px; color: #cbd5e1;">Final Score: <span id="finalScore" style="color:#38bdf8; font-weight:bold;">0</span></p>
      <button class="btn" id="restartBtn">PLAY AGAIN</button>
    </div>
  </div>

  <div class="controls-hint">
    <span>[WASD / Arrows] Move</span>
    <span>[Space] Pause</span>
  </div>

  <div class="touch-pad">
    <div></div>
    <button class="t-btn" id="t-up">▲</button>
    <div></div>
    <button class="t-btn" id="t-left">◀</button>
    <button class="t-btn" id="t-down">▼</button>
    <button class="t-btn" id="t-right">▶</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const finalScoreEl = document.getElementById('finalScore');
    const startOverlay = document.getElementById('startOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');

    // Web Audio Synthesizer
    let audioCtx = null;
    function playBeep(freq, type = 'sine', duration = 0.08) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    const GRID_SIZE = 20;
    const TILE_COUNT = 20;
    let snake = [];
    let dir = { x: 1, y: 0 };
    let nextDir = { x: 1, y: 0 };
    let food = { x: 15, y: 10, special: false };
    let score = 0;
    let highScore = parseInt(localStorage.getItem('snake_highscore') || '0', 10);
    highScoreEl.textContent = highScore;
    let gameLoop = null;
    let isPaused = false;
    let isRunning = false;
    let speed = 100;

    function resetGame() {
      snake = [
        { x: 6, y: 10 },
        { x: 5, y: 10 },
        { x: 4, y: 10 }
      ];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      speed = 105;
      scoreEl.textContent = score;
      spawnFood();
      isRunning = true;
      isPaused = false;
      startOverlay.classList.add('hidden');
      gameOverOverlay.classList.add('hidden');
      if (gameLoop) clearInterval(gameLoop);
      gameLoop = setInterval(update, speed);
    }

    function spawnFood() {
      let valid = false;
      while (!valid) {
        food.x = Math.floor(Math.random() * TILE_COUNT);
        food.y = Math.floor(Math.random() * TILE_COUNT);
        valid = !snake.some(segment => segment.x === food.x && segment.y === food.y);
      }
      food.special = Math.random() < 0.2;
    }

    function update() {
      if (isPaused || !isRunning) return;
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // Wall collision
      if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
        return gameOver();
      }

      // Self collision
      if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
        return gameOver();
      }

      snake.unshift(head);

      // Eat food
      if (head.x === food.x && head.y === food.y) {
        const points = food.special ? 30 : 10;
        score += points;
        scoreEl.textContent = score;
        playBeep(food.special ? 880 : 540, 'triangle', 0.1);
        if (score > highScore) {
          highScore = score;
          highScoreEl.textContent = highScore;
          localStorage.setItem('snake_highscore', highScore.toString());
        }
        spawnFood();
        // Speed up slightly
        if (speed > 55 && score % 40 === 0) {
          speed -= 5;
          clearInterval(gameLoop);
          gameLoop = setInterval(update, speed);
        }
      } else {
        snake.pop();
      }

      draw();
    }

    function gameOver() {
      isRunning = false;
      clearInterval(gameLoop);
      playBeep(180, 'sawtooth', 0.3);
      finalScoreEl.textContent = score;
      gameOverOverlay.classList.remove('hidden');
    }

    function draw() {
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Subtle grid
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 0.5;
      for (let i = 0; i <= canvas.width; i += GRID_SIZE) {
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i);
        ctx.lineTo(canvas.width, i);
        ctx.stroke();
      }

      // Draw food
      ctx.save();
      ctx.shadowBlur = 12;
      ctx.shadowColor = food.special ? '#f59e0b' : '#38bdf8';
      ctx.fillStyle = food.special ? '#f59e0b' : '#0ea5e9';
      ctx.beginPath();
      ctx.arc(
        food.x * GRID_SIZE + GRID_SIZE / 2,
        food.y * GRID_SIZE + GRID_SIZE / 2,
        GRID_SIZE / 2 - 2,
        0,
        Math.PI * 2
      );
      ctx.fill();
      ctx.restore();

      // Draw snake
      snake.forEach((seg, index) => {
        ctx.save();
        if (index === 0) {
          ctx.fillStyle = '#38bdf8';
          ctx.shadowBlur = 10;
          ctx.shadowColor = '#0284c7';
        } else {
          const ratio = 1 - (index / snake.length) * 0.5;
          ctx.fillStyle = `rgba(14, 165, 233, ${ratio})`;
        }
        const r = 4;
        const x = seg.x * GRID_SIZE + 1;
        const y = seg.y * GRID_SIZE + 1;
        const w = GRID_SIZE - 2;
        const h = GRID_SIZE - 2;
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, r);
        ctx.fill();
        ctx.restore();
      });
    }

    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
        e.preventDefault();
      }
      if (!isRunning && (e.key === ' ' || e.key === 'Enter')) {
        resetGame();
        return;
      }
      if (e.key === ' ' && isRunning) {
        isPaused = !isPaused;
        return;
      }

      const key = e.key.toLowerCase();
      if ((key === 'arrowup' || key === 'w') && dir.y !== 1) nextDir = { x: 0, y: -1 };
      else if ((key === 'arrowdown' || key === 's') && dir.y !== -1) nextDir = { x: 0, y: 1 };
      else if ((key === 'arrowleft' || key === 'a') && dir.x !== 1) nextDir = { x: -1, y: 0 };
      else if ((key === 'arrowright' || key === 'd') && dir.x !== -1) nextDir = { x: 1, y: 0 };
    });

    startBtn.addEventListener('click', resetGame);
    restartBtn.addEventListener('click', resetGame);

    // Touch controls
    document.getElementById('t-up').addEventListener('click', () => { if (dir.y !== 1) nextDir = { x: 0, y: -1 }; });
    document.getElementById('t-down').addEventListener('click', () => { if (dir.y !== -1) nextDir = { x: 0, y: 1 }; });
    document.getElementById('t-left').addEventListener('click', () => { if (dir.x !== 1) nextDir = { x: -1, y: 0 }; });
    document.getElementById('t-right').addEventListener('click', () => { if (dir.x !== -1) nextDir = { x: 1, y: 0 }; });

    // Initial draw
    draw();
  </script>
</body>
</html>
