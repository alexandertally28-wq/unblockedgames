<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Minesweeper Sweeper</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
      touch-action: manipulation;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 360px;
      background: #0f172a;
      border: 2px solid #1e293b;
      border-radius: 8px 8px 0 0;
      padding: 10px 14px;
    }
    .val-box {
      font-family: monospace;
      font-size: 20px;
      font-weight: 800;
      color: #ef4444;
      background: #020617;
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid #1e293b;
      min-width: 54px;
      text-align: center;
    }
    .face-btn {
      background: #1e293b;
      border: 1px solid #334155;
      font-size: 22px;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .face-btn:active { transform: scale(0.95); }
    #board-wrap {
      background: #0f172a;
      border: 2px solid #1e293b;
      border-top: none;
      border-radius: 0 0 8px 8px;
      padding: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      overflow: auto;
      max-width: 95vw;
    }
    #grid {
      display: grid;
      gap: 3px;
    }
    .cell {
      width: 32px;
      height: 32px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      user-select: none;
      transition: background 0.1s;
    }
    .cell:hover { background: #334155; }
    .cell.revealed {
      background: #0b1120;
      border-color: #1e293b;
      cursor: default;
    }
    .cell.mine { background: #ef4444 !important; }
    .n-1 { color: #38bdf8; }
    .n-2 { color: #10b981; }
    .n-3 { color: #f43f5e; }
    .n-4 { color: #a855f7; }
    .n-5 { color: #f59e0b; }
    .n-6 { color: #06b6d4; }
    .n-7 { color: #cbd5e1; }
    .n-8 { color: #94a3b8; }
    .difficulty-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .d-btn {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    .d-btn.active {
      background: #0284c7;
      color: white;
      border-color: #38bdf8;
    }
    .hint {
      margin-top: 10px;
      font-size: 12px;
      color: #64748b;
      display: flex;
      gap: 12px;
    }
  </style>
</head>
<body>
  <div class="difficulty-bar">
    <button class="d-btn active" id="btnBeg">Beginner (9x9)</button>
    <button class="d-btn" id="btnMed">Intermediate (12x12)</button>
  </div>

  <div class="hud">
    <div class="val-box" id="minesEl">010</div>
    <button class="face-btn" id="faceBtn">🙂</button>
    <div class="val-box" id="timerEl">000</div>
  </div>

  <div id="board-wrap">
    <div id="grid"></div>
  </div>

  <div class="hint">
    <span>Left Click: Reveal</span>
    <span>Right Click: Flag (🚩)</span>
  </div>

  <script>
    let audioCtx = null;
    function playClickSound(freq = 400) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
      } catch (e) {}
    }

    const gridEl = document.getElementById('grid');
    const minesEl = document.getElementById('minesEl');
    const timerEl = document.getElementById('timerEl');
    const faceBtn = document.getElementById('faceBtn');
    const btnBeg = document.getElementById('btnBeg');
    const btnMed = document.getElementById('btnMed');

    let rows = 9;
    let cols = 9;
    let totalMines = 10;
    let board = [];
    let gameOver = false;
    let firstClick = true;
    let flagsLeft = 10;
    let timer = 0;
    let timerInterval = null;

    btnBeg.addEventListener('click', () => {
      rows = 9; cols = 9; totalMines = 10;
      btnBeg.classList.add('active');
      btnMed.classList.remove('active');
      init();
    });

    btnMed.addEventListener('click', () => {
      rows = 12; cols = 12; totalMines = 20;
      btnMed.classList.add('active');
      btnBeg.classList.remove('active');
      init();
    });

    faceBtn.addEventListener('click', init);

    function init() {
      gameOver = false;
      firstClick = true;
      flagsLeft = totalMines;
      minesEl.textContent = String(flagsLeft).padStart(3, '0');
      timer = 0;
      timerEl.textContent = '000';
      faceBtn.textContent = '🙂';
      if (timerInterval) clearInterval(timerInterval);

      gridEl.style.gridTemplateColumns = `repeat(${cols}, 32px)`;
      gridEl.innerHTML = '';

      board = [];
      for (let r = 0; r < rows; r++) {
        const row = [];
        for (let c = 0; c < cols; c++) {
          const cell = {
            r, c,
            isMine: false,
            revealed: false,
            flagged: false,
            neighborCount: 0,
            el: document.createElement('div')
          };
          cell.el.className = 'cell';
          cell.el.addEventListener('click', () => handleClick(cell));
          cell.el.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            handleRightClick(cell);
          });
          gridEl.appendChild(cell.el);
          row.push(cell);
        }
        board.push(row);
      }
    }

    function plantMines(safeR, safeC) {
      let planted = 0;
      while (planted < totalMines) {
        const r = Math.floor(Math.random() * rows);
        const c = Math.floor(Math.random() * cols);
        if ((r === safeR && c === safeC) || board[r][c].isMine) continue;
        board[r][c].isMine = true;
        planted++;
      }

      // Calculate neighbor counts
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (board[r][c].isMine) continue;
          let count = 0;
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              const nr = r + dr;
              const nc = c + dc;
              if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && board[nr][nc].isMine) {
                count++;
              }
            }
          }
          board[r][c].neighborCount = count;
        }
      }
    }

    function handleClick(cell) {
      if (gameOver || cell.revealed || cell.flagged) return;

      if (firstClick) {
        firstClick = false;
        plantMines(cell.r, cell.c);
        timerInterval = setInterval(() => {
          timer = Math.min(999, timer + 1);
          timerEl.textContent = String(timer).padStart(3, '0');
        }, 1000);
      }

      if (cell.isMine) {
        endGame(false, cell);
        return;
      }

      reveal(cell);
      playClickSound(500);
      checkWin();
    }

    function handleRightClick(cell) {
      if (gameOver || cell.revealed) return;
      if (cell.flagged) {
        cell.flagged = false;
        cell.el.textContent = '';
        flagsLeft++;
      } else if (flagsLeft > 0) {
        cell.flagged = true;
        cell.el.textContent = '🚩';
        flagsLeft--;
      }
      minesEl.textContent = String(flagsLeft).padStart(3, '0');
      playClickSound(300);
    }

    function reveal(cell) {
      if (cell.revealed || cell.flagged) return;
      cell.revealed = true;
      cell.el.classList.add('revealed');

      if (cell.neighborCount > 0) {
        cell.el.textContent = cell.neighborCount;
        cell.el.classList.add(`n-${cell.neighborCount}`);
      } else {
        // Flood fill empty neighbors
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            const nr = cell.r + dr;
            const nc = cell.c + dc;
            if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
              reveal(board[nr][nc]);
            }
          }
        }
      }
    }

    function checkWin() {
      let unrevealedSafe = 0;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (!board[r][c].isMine && !board[r][c].revealed) {
            unrevealedSafe++;
          }
        }
      }
      if (unrevealedSafe === 0) endGame(true);
    }

    function endGame(won, triggeredMine = null) {
      gameOver = true;
      clearInterval(timerInterval);
      faceBtn.textContent = won ? '😎' : '😵';

      // Reveal all mines
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const cell = board[r][c];
          if (cell.isMine) {
            cell.el.textContent = '💣';
            if (!won) cell.el.classList.add('mine');
          }
        }
      }
      if (triggeredMine) {
        triggeredMine.el.style.background = '#e11d48';
      }
    }

    init();
  </script>
</body>
</html>
