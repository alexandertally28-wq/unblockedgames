<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>2048 Neon</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
      touch-action: none;
    }
    .header {
      width: 100%;
      max-width: 380px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .title-box h1 {
      font-size: 28px;
      font-weight: 800;
      color: #38bdf8;
      letter-spacing: -1px;
    }
    .scores {
      display: flex;
      gap: 8px;
    }
    .score-card {
      background: #1e293b;
      padding: 6px 12px;
      border-radius: 8px;
      text-align: center;
      min-width: 70px;
    }
    .score-card .label { font-size: 10px; color: #94a3b8; font-weight: 700; text-transform: uppercase; }
    .score-card .val { font-size: 16px; font-weight: 800; color: #38bdf8; }
    .actions-bar {
      width: 100%;
      max-width: 380px;
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn:hover { background: #0369a1; }
    .btn-secondary {
      background: #334155;
    }
    .btn-secondary:hover { background: #475569; }

    #board {
      position: relative;
      width: 380px;
      height: 380px;
      max-width: 92vw;
      max-height: 92vw;
      background: #0f172a;
      border: 2px solid #1e293b;
      border-radius: 12px;
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .cell {
      background: rgba(30, 41, 59, 0.4);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 800;
      user-select: none;
      transition: transform 0.1s ease, background 0.15s ease;
    }
    .tile-2 { background: #1e293b; color: #f8fafc; }
    .tile-4 { background: #334155; color: #f8fafc; }
    .tile-8 { background: #0369a1; color: #ffffff; box-shadow: 0 0 10px rgba(3, 105, 161, 0.4); }
    .tile-16 { background: #0284c7; color: #ffffff; box-shadow: 0 0 12px rgba(2, 132, 199, 0.5); }
    .tile-32 { background: #06b6d4; color: #020617; box-shadow: 0 0 14px rgba(6, 182, 212, 0.6); }
    .tile-64 { background: #10b981; color: #020617; box-shadow: 0 0 16px rgba(16, 185, 129, 0.6); }
    .tile-128 { background: #eab308; color: #020617; font-size: 20px; box-shadow: 0 0 18px rgba(234, 179, 8, 0.7); }
    .tile-256 { background: #f97316; color: #ffffff; font-size: 20px; box-shadow: 0 0 20px rgba(249, 115, 22, 0.7); }
    .tile-512 { background: #ef4444; color: #ffffff; font-size: 20px; box-shadow: 0 0 22px rgba(239, 68, 68, 0.8); }
    .tile-1024 { background: #ec4899; color: #ffffff; font-size: 17px; box-shadow: 0 0 24px rgba(236, 72, 153, 0.85); }
    .tile-2048 { background: #a855f7; color: #ffffff; font-size: 17px; box-shadow: 0 0 28px rgba(168, 85, 247, 0.95); animation: pulse 1.5s infinite; }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(4px);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 10;
    }
    .modal-overlay.hidden { display: none; }
    .hint {
      margin-top: 14px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title-box">
      <h1>2048</h1>
    </div>
    <div class="scores">
      <div class="score-card">
        <div class="label">SCORE</div>
        <div class="val" id="score">0</div>
      </div>
      <div class="score-card">
        <div class="label">BEST</div>
        <div class="val" id="highScore">0</div>
      </div>
    </div>
  </div>

  <div class="actions-bar">
    <button class="btn btn-secondary" id="undoBtn">↶ Undo</button>
    <button class="btn" id="newGameBtn">New Game</button>
  </div>

  <div id="board">
    <div id="gameOverlay" class="modal-overlay hidden">
      <h2 id="overlayTitle" style="font-size: 26px; font-weight:800; color: #f43f5e;">GAME OVER</h2>
      <button class="btn" id="overlayRestartBtn">Try Again</button>
    </div>
  </div>

  <div class="hint">Use Arrow Keys or Swipe to merge numbers to 2048!</div>

  <script>
    let audioCtx = null;
    function playTone(freq, duration = 0.06) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    const boardEl = document.getElementById('board');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const gameOverlay = document.getElementById('gameOverlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const newGameBtn = document.getElementById('newGameBtn');
    const overlayRestartBtn = document.getElementById('overlayRestartBtn');
    const undoBtn = document.getElementById('undoBtn');

    let grid = Array(4).fill(null).map(() => Array(4).fill(0));
    let previousState = null;
    let score = 0;
    let highScore = parseInt(localStorage.getItem('2048_highscore') || '0', 10);
    highScoreEl.textContent = highScore;
    let won = false;

    function init() {
      grid = Array(4).fill(null).map(() => Array(4).fill(0));
      score = 0;
      won = false;
      previousState = null;
      scoreEl.textContent = '0';
      gameOverlay.classList.add('hidden');
      addRandomTile();
      addRandomTile();
      render();
    }

    function saveState() {
      previousState = {
        grid: grid.map(row => [...row]),
        score: score
      };
    }

    function undo() {
      if (!previousState) return;
      grid = previousState.grid;
      score = previousState.score;
      scoreEl.textContent = score;
      previousState = null;
      gameOverlay.classList.add('hidden');
      render();
    }

    function addRandomTile() {
      const empty = [];
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          if (grid[r][c] === 0) empty.push({ r, c });
        }
      }
      if (empty.length === 0) return;
      const { r, c } = empty[Math.floor(Math.random() * empty.length)];
      grid[r][c] = Math.random() < 0.9 ? 2 : 4;
    }

    function render() {
      // Clear all cells except the overlay
      const cells = boardEl.querySelectorAll('.cell');
      cells.forEach(c => c.remove());

      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          const val = grid[r][c];
          const cell = document.createElement('div');
          cell.className = 'cell' + (val > 0 ? ` tile-${val}` : '');
          cell.textContent = val > 0 ? val : '';
          boardEl.appendChild(cell);
        }
      }
    }

    function slide(row) {
      let filtered = row.filter(val => val !== 0);
      let newRow = [];
      let gained = 0;
      for (let i = 0; i < filtered.length; i++) {
        if (i < filtered.length - 1 && filtered[i] === filtered[i + 1]) {
          const merged = filtered[i] * 2;
          newRow.push(merged);
          gained += merged;
          if (merged === 2048 && !won) {
            won = true;
            playTone(880, 0.3);
          }
          i++;
        } else {
          newRow.push(filtered[i]);
        }
      }
      while (newRow.length < 4) newRow.push(0);
      return { row: newRow, gained };
    }

    function moveLeft() {
      let changed = false;
      let totalGained = 0;
      for (let r = 0; r < 4; r++) {
        const { row, gained } = slide(grid[r]);
        if (row.some((val, idx) => val !== grid[r][idx])) changed = true;
        grid[r] = row;
        totalGained += gained;
      }
      return { changed, totalGained };
    }

    function rotate() {
      const newGrid = Array(4).fill(null).map(() => Array(4).fill(0));
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          newGrid[c][3 - r] = grid[r][c];
        }
      }
      grid = newGrid;
    }

    function handleMove(direction) {
      saveState();
      let rotations = 0;
      if (direction === 'left') rotations = 0;
      else if (direction === 'down') rotations = 1;
      else if (direction === 'right') rotations = 2;
      else if (direction === 'up') rotations = 3;

      for (let i = 0; i < rotations; i++) rotate();
      const { changed, totalGained } = moveLeft();
      for (let i = 0; i < (4 - rotations) % 4; i++) rotate();

      if (changed) {
        if (totalGained > 0) {
          score += totalGained;
          scoreEl.textContent = score;
          playTone(400 + Math.min(totalGained, 1000), 0.08);
          if (score > highScore) {
            highScore = score;
            highScoreEl.textContent = highScore;
            localStorage.setItem('2048_highscore', highScore.toString());
          }
        } else {
          playTone(280, 0.04);
        }
        addRandomTile();
        render();

        if (checkGameOver()) {
          overlayTitle.textContent = "GAME OVER";
          overlayTitle.style.color = "#f43f5e";
          gameOverlay.classList.remove('hidden');
        }
      }
    }

    function checkGameOver() {
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          if (grid[r][c] === 0) return false;
          if (c < 3 && grid[r][c] === grid[r][c + 1]) return false;
          if (r < 3 && grid[r][c] === grid[r + 1][c]) return false;
        }
      }
      return true;
    }

    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
        e.preventDefault();
        if (e.key === 'ArrowUp') handleMove('up');
        if (e.key === 'ArrowDown') handleMove('down');
        if (e.key === 'ArrowLeft') handleMove('left');
        if (e.key === 'ArrowRight') handleMove('right');
      }
    });

    let touchStartX = 0;
    let touchStartY = 0;
    boardEl.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    boardEl.addEventListener('touchend', (e) => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 30) {
        handleMove(dx > 0 ? 'right' : 'left');
      } else if (Math.abs(dy) > 30) {
        handleMove(dy > 0 ? 'down' : 'up');
      }
    }, { passive: true });

    newGameBtn.addEventListener('click', init);
    overlayRestartBtn.addEventListener('click', init);
    undoBtn.addEventListener('click', undo);

    init();
  </script>
</body>
</html>
